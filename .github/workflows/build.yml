name: Build GAZ AI

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk GAZ-AI.apk
      - uses: actions/upload-artifact@v4
        with: { name: GAZ-AI, path: GAZ-AI.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: gaz-ai-v0.1.0
          name: GAZ AI 0.1.0 (preview)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: GAZ-AI.apk
          body: |
            **GAZ AI** – Your Messages. Your Style. Your Personal AI Assistant.
            Gaz Media Production

            Install **GAZ-AI.apk** on your Android phone (Android 8 or newer).
            First run: allow notification access, notifications and background running, then add your free Gemini API key.
