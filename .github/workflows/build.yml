name: Build Gaz Live Mixer

on:
  push:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk GazLiveMixer.apk
      - uses: actions/upload-artifact@v4
        with: { name: GazLiveMixer-android, path: GazLiveMixer.apk }

  script-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out/gaz-live-mixer-script
          cp obs-script/*.py shared/*.html out/gaz-live-mixer-script/
      - uses: actions/upload-artifact@v4
        with: { name: GazLiveMixer-obs-script, path: out }

  plugin-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libobs-dev qt6-base-dev
      - run: |
          cmake -S obs-plugin -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          cmake --install build --prefix out
      - uses: actions/upload-artifact@v4
        with: { name: GazLiveMixer-plugin-linux, path: out }

  # Windows: builds the OBS SDK (libobs + frontend API) from source, then the plugin.
  # Change OBS_VERSION to match the OBS you run (30.x or newer).
  plugin-windows:
    runs-on: windows-2022
    env:
      OBS_VERSION: "30.2.3"
    steps:
      - uses: actions/checkout@v4
      - name: Get OBS source
        shell: pwsh
        run: git clone --depth 1 --branch $env:OBS_VERSION --recurse-submodules --shallow-submodules https://github.com/obsproject/obs-studio.git obs-src
      - name: Configure and build OBS SDK
        shell: pwsh
        working-directory: obs-src
        run: |
          cmake --preset windows-x64 -DENABLE_BROWSER=OFF -DENABLE_WEBSOCKET=OFF -DENABLE_SCRIPTING=OFF -DENABLE_VLC=OFF -DENABLE_AJA=OFF -DENABLE_NVENC=OFF -DENABLE_WEBRTC=OFF -DENABLE_VIRTUALCAM=OFF -DENABLE_UPDATER=OFF
          cmake --build build_x64 --config RelWithDebInfo --target obs-frontend-api
          cmake --install build_x64 --config RelWithDebInfo --component Development --prefix ${{ github.workspace }}/obs-sdk
      - name: Build plugin
        shell: pwsh
        run: |
          $deps = (Get-ChildItem obs-src/.deps -Directory | ForEach-Object { $_.FullName }) -join ';'
          $sdk = "${{ github.workspace }}/obs-sdk"
          cmake -S obs-plugin -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$sdk;$sdk/cmake;$deps"
          if ($LASTEXITCODE) { exit 1 }
          cmake --build build --config RelWithDebInfo
          if ($LASTEXITCODE) { exit 1 }
          cmake --install build --config RelWithDebInfo --prefix out/gaz-live-mixer
      - uses: actions/upload-artifact@v4
        with: { name: GazLiveMixer-plugin-windows, path: out }
      - name: Build desktop app
        shell: pwsh
        run: |
          dotnet build desktop-app/GazLiveMixer.csproj -c Release
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem -Recurse desktop-app/bin/Release/net48 | Select-Object FullName
      - name: Build installer
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DPluginDir=${{ github.workspace }}\out\gaz-live-mixer" "/DAppDir=${{ github.workspace }}\desktop-app\bin\Release\net48" "/DWebView2Setup=$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe" "/DMyAppVersion=1.1.0" installer/GazLiveMixer.iss
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: GazLiveMixer-installer, path: installer/output/*.exe }

  release:
    needs: [android-apk, script-edition, plugin-linux, plugin-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Package downloads
        run: |
          mkdir dist
          cp art/GazLiveMixer-installer/*.exe dist/
          cp art/GazLiveMixer-android/GazLiveMixer.apk dist/GazLiveMixer-Android.apk
          (cd art/GazLiveMixer-obs-script && zip -qr ../../dist/GazLiveMixer-OBS-Script.zip .)
          (cd art/GazLiveMixer-plugin-windows && zip -qr ../../dist/GazLiveMixer-OBS-Plugin-Windows.zip .)
          (cd art/GazLiveMixer-plugin-linux && zip -qr ../../dist/GazLiveMixer-OBS-Plugin-Linux.zip .)
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Gaz Live Mixer 1.1.0
          make_latest: true
          files: dist/*
          body: |
            **Gaz Live Mixer** – control OBS like a video mixer from your phone or another PC.
            Gaz Media Production · Everything Multimedia

            - **GazLiveMixer-Setup-1.1.0.exe** – the easy way. Run it on the OBS PC: it installs the OBS plugin, opens the firewall for your phones, and installs the Gaz Live Mixer desktop app. On a remote PC choose "Remote PC only" to install just the app.
            - **GazLiveMixer-OBS-Plugin-Windows.zip** – manual install: copy the `obs-plugins` and `data` folders into `C:\Program Files\obs-studio\` (OBS 30+), restart OBS, open Docks → Gaz Live Mixer.
            - **GazLiveMixer-OBS-Script.zip** – alternative: OBS → Tools → Scripts → + → gaz_live_mixer.py (needs Python).
            - **GazLiveMixer-Android.apk** – install on your phone; it finds OBS on the Wi-Fi.
            - Any browser works too: scan the QR code shown in OBS.

            Use the plugin **or** the script, not both.
